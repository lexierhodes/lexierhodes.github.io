
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexie Rhodes - QR Code</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    font-family: system-ui, sans-serif;
    background: #fff;
    color: #222;
  }

  #qr {
    width: min(90vw, 520px);
  }

  #qr svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .btns {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .5rem;
  }

  button {
    padding: .5rem 1rem;
    border: 1px solid #888;
    border-radius: 6px;
    background: #f4f4f4;
    cursor: pointer;
    font-size: 1rem;
  }

  button:hover {
    background: #e8e8e8;
  }

  #label {
    font-size: .85rem;
    color: #555;
  }

  @media print {
    .btns, p { display: none; }
  }
</style>
</head>

<body>

<div id="qr"></div>

<div class="btns">
  <button id="dl-svg">Download SVG (best for posters)</button>
  <button id="dl-png">Download PNG</button>
</div>

<p id="label"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script>


// =============================================
//             CUSTOMIZE YOUR QR CODE
// =============================================

const SITE_URL = "https://lexierhodes.github.io/";

const BLUE = "#3979c5";
const LOGO_FRACTION = 0.14;
const QR_COLOR = "#17212b";

const BIRD_PATH = "assets/bluebird-qr.png";

// =============================================
//              LOAD BIRD IMAGE
// =============================================

async function loadBird() {

  const response = await fetch(BIRD_PATH);

  if (!response.ok) {
    throw new Error(
      `Could not load bird image: ${BIRD_PATH}`
    );
  }

  const blob = await response.blob();

  // Convert PNG to embedded data URL.
  // This makes SVG and PNG downloads self-contained.
  return await new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);

    reader.readAsDataURL(blob);

  });
}

// =============================================
//                BUILD QR CODE
// =============================================

function buildSVG(birdData) {

  const qr = qrcode(0, "H");

  qr.addData(SITE_URL);
  qr.make();

  const n = qr.getModuleCount();

  const quiet = 4;
  const size = n + quiet * 2;

  // Space reserved for center illustration
  const clear = Math.ceil(n * LOGO_FRACTION) + 2;

  const lo = Math.floor((n - clear) / 2);

  let d = "";

  // Draw QR modules, leaving the center clear.
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {

      if (!qr.isDark(r, c)) continue;

      if (
        r >= lo && r < lo + clear &&
        c >= lo && c < lo + clear
      ) continue;

      d += `M${c + quiet} ${r + quiet}h1v1h-1z`;
    }
  }

  const center = quiet + lo + clear / 2;

  // =============================================
  //                  SVG OUTPUT
  // =============================================

  return `
  <svg xmlns="http://www.w3.org/2000/svg"
       xmlns:xlink="http://www.w3.org/1999/xlink"
       viewBox="0 0 ${size} ${size}">

    <!-- White background -->
    <rect
      width="${size}"
      height="${size}"
      fill="#ffffff"
    />

    <!-- QR modules -->
    <path
      d="${d}"
      fill="${QR_COLOR}"
      shape-rendering="crispEdges"
    />

    <!-- White center badge -->
    <circle
      cx="${center}"
      cy="${center}"
      r="${clear * 0.49}"
      fill="#ffffff"
    />

    <!-- Eastern bluebird PNG -->
    <image
      href="${birdData}"
      x="${quiet + lo}"
      y="${quiet + lo}"
      width="${clear}"
      height="${clear}"
      preserveAspectRatio="xMidYMid meet"
    />

  </svg>
  `;
}

// =============================================
//               DISPLAY QR CODE
// =============================================

async function initializeQR() {

  try {

    // Load image first
    const birdData = await loadBird();

    // Generate complete SVG
    const svg = buildSVG(birdData);

    // Display QR code
    document.getElementById("qr").innerHTML = svg;

    document.getElementById("label").textContent = SITE_URL;

    // =============================================
    //                  DOWNLOADS
    // =============================================

    function save(blob, name) {

      const a = document.createElement("a");

      const url = URL.createObjectURL(blob);

      a.href = url;
      a.download = name;

      a.click();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // SVG download
    document.getElementById("dl-svg").onclick = () => {

      save(
        new Blob([svg], {
          type: "image/svg+xml"
        }),
        "lexie-rhodes-bluebird-qr.svg"
      );

    };

    // PNG download
    document.getElementById("dl-png").onclick = () => {

      const img = new Image();

      img.onload = () => {

        const px = 2400;

        const canvas = document.createElement("canvas");

        canvas.width = px;
        canvas.height = px;

        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, px, px);

        ctx.imageSmoothingEnabled = false;

        ctx.drawImage(img, 0, 0, px, px);

        canvas.toBlob(blob => {

          if (blob) {
            save(
              blob,
              "lexie-rhodes-bluebird-qr.png"
            );
          }

        }, "image/png");

      };

      img.onerror = () => {
        alert("Could not generate PNG. Try downloading the SVG.");
      };

      img.src =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

    };

  } catch (error) {

    console.error(error);

    document.getElementById("qr").textContent =
      "Error loading QR code or bird image. Check the image path.";

  }

}

// Start everything
initializeQR();


</script>

</body>
</html>
